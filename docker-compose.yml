version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=cyber_banking
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 cyber_physical_banking.wsgi:application
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - MEDIA_URL=/media/
      - MEDIA_ROOT=/app/media
      - SECRET_KEY=sb_publishable_jmRPDw1GYMj7WCErEpvIWg_53fpNk0x
      - DATABASE_URL=postgresql://postgres:Bhuvan%4012!345@db.vmxgmwmusrzzdyhxvcov.supabase.co:5432/postgres
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
