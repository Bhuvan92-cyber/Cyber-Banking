[pytest]
DJANGO_SETTINGS_MODULE = cyber_physical_banking.settings
python_files = tests.py test_*.py *_tests.py
testpaths = tests
norecursedirs = node_modules .venv frontend .git media
addopts = -v --tb=short --strict-markers --ds=cyber_physical_banking.settings -p no:locust
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
